name: Update VPN Sub

on:
  schedule:
    - cron: '*/10 * * * *' # Запускать каждые 6 часов
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает роботу права сохранять файл sub.txt обратно в репозиторий
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Принудительный фикс для Node.js 24 (убирает ошибку билда)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обновлено с v3 на v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 # Обновлено с v4 на v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Run Filter Script
        run: python main.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email "action@github.com"
          git add sub.txt
          git commit -m "Auto-update VPN servers" || echo "No changes to commit"
          git push
